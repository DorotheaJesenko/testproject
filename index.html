<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit properly on a phone screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cutest Bird Vote</title>

  <style>
    /* ---------- Looks (CSS) ---------- */
    body {
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
      color: #222;
      margin: 0;
      padding: 28px 16px 56px;
      text-align: center;
    }

    h1 {
      font-size: 2.1rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 28px;
    }

    /* The grid holding the four cards: 1 column on phones, 2 on wider screens */
    #birds {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 700px;
      margin: 0 auto 28px;
    }

    @media (min-width: 560px) {
      #birds {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      border-radius: 20px;
      padding: 28px 20px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .emoji {
      font-size: 5rem;
      line-height: 1;
    }

    .name {
      font-size: 1.6rem;
      font-weight: bold;
      margin: 10px 0 6px;
    }

    /* The vote count: a big number with a small word next to it */
    .count {
      margin-bottom: 18px;
    }

    .number {
      font-size: 3rem;
      font-weight: bold;
      line-height: 1;
    }

    .label {
      font-size: 1.1rem;
      margin-left: 6px;
      color: #444;
    }

    button {
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .vote-btn {
      color: white;
      width: 100%;
      padding: 16px;
      font-size: 1.3rem;
      font-weight: bold;
    }

    /* Makes any button a little darker when the mouse is over it */
    button:hover {
      filter: brightness(0.9);
    }

    #reset {
      background: #e5e7eb;
      color: #333;
      padding: 14px 28px;
    }

    /* ---------- The little flying birds ---------- */

    /* Each flying bird stays fixed on the screen and ignores clicks */
    .flyer {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      line-height: 1;
      animation-name: fly;
      animation-timing-function: ease-in-out;
      animation-fill-mode: both;
    }

    /* The flight: start small, swoop out to the middle point, then fade away.
       --dx and --dy are how far it travels; --rot is how much it spins.
       The code below picks random numbers for these, so every bird is different. */
    @keyframes fly {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(0.4);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      50% {
        transform: translate(calc(var(--dx) * 0.5), calc(var(--dy) * 0.5 - 70px))
                   rotate(calc(var(--rot) * 0.5)) scale(1);
      }
      100% {
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.8);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <!-- ---------- What appears on the page (HTML) ---------- -->
  <h1>Which bird is the cutest? 🐦</h1>
  <p class="subtitle">Tap Vote on your favourite!</p>

  <!-- The bird cards get added here by the code below -->
  <div id="birds"></div>

  <button id="reset">Reset votes</button>

  <script>
    // ---------- What the page does (JavaScript) ----------

    // The list of birds. Each bird has:
    //   bg   = the light colour of its card
    //   dark = the darker colour of its Vote button
    // To add another bird later, add another line here.
    const birds = [
      { id: "owl",     name: "Owl",     emoji: "🦉", bg: "#f1dfc6", dark: "#8a5a2b" },
      { id: "duck",    name: "Duck",    emoji: "🦆", bg: "#d6f0d0", dark: "#2f8f3a" },
      { id: "penguin", name: "Penguin", emoji: "🐧", bg: "#d3e6fb", dark: "#2b6cb0" },
      { id: "parrot",  name: "Parrot",  emoji: "🦜", bg: "#fbd5dc", dark: "#d6336c" }
    ];

    // The name of the "drawer" in the browser where we save the votes
    const STORAGE_KEY = "birdVotes";

    // Get saved votes from the browser (or start empty if there are none)
    function loadVotes() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
      } catch (error) {
        return {};
      }
    }

    // Save the votes into the browser
    function saveVotes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
      } catch (error) {
        // If saving isn't allowed, the page still works, it just won't remember
      }
    }

    let votes = loadVotes();

    // Draw all the bird cards on the page
    function showBirds() {
      const container = document.getElementById("birds");
      container.innerHTML = "";

      birds.forEach(function (bird) {
        const count = votes[bird.id] || 0;
        const word = count === 1 ? "vote" : "votes";

        const card = document.createElement("div");
        card.className = "card";
        card.style.background = bird.bg;
        card.innerHTML =
          '<div class="emoji">' + bird.emoji + '</div>' +
          '<div class="name">' + bird.name + '</div>' +
          '<div class="count"><span class="number">' + count + '</span>' +
          '<span class="label">' + word + '</span></div>' +
          '<button class="vote-btn" data-id="' + bird.id + '" ' +
          'style="background:' + bird.dark + '">Vote</button>';

        container.appendChild(card);
      });
    }

    // Make little birds fly out from a spot on the screen (x and y)
    function flyBirds(emoji, x, y) {
      // If someone has "reduce motion" turned on in their device settings,
      // we skip the animation to be kind to them
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const howMany = 14; // change this number for more or fewer birds

      for (let i = 0; i < howMany; i++) {
        const flyer = document.createElement("span");
        flyer.className = "flyer";
        flyer.textContent = emoji;

        // Start at the spot where the button was
        flyer.style.left = x + "px";
        flyer.style.top = y + "px";

        // Pick a random size, direction, spin, speed and delay for each bird
        flyer.style.fontSize = (1.5 + Math.random() * 1.2) + "rem";
        flyer.style.setProperty("--dx", ((Math.random() - 0.5) * window.innerWidth * 1.3) + "px");
        flyer.style.setProperty("--dy", ((Math.random() - 0.5) * window.innerHeight * 1.3) + "px");
        flyer.style.setProperty("--rot", ((Math.random() - 0.5) * 720) + "deg");
        flyer.style.animationDuration = (2 + Math.random() * 1.5) + "s";
        flyer.style.animationDelay = (Math.random() * 0.4) + "s";

        // When its flight is over, remove it from the page
        flyer.addEventListener("animationend", function () {
          flyer.remove();
        });

        document.body.appendChild(flyer);
      }
    }

    // When any Vote button is clicked, add one vote for that bird
    document.getElementById("birds").addEventListener("click", function (event) {
      const id = event.target.getAttribute("data-id");
      if (!id) return; // the click wasn't on a Vote button

      // Work out where the button is, so the little birds start from there
      const box = event.target.getBoundingClientRect();
      const x = box.left + box.width / 2;
      const y = box.top + box.height / 2;

      const bird = birds.find(function (b) { return b.id === id; });

      votes[id] = (votes[id] || 0) + 1;
      saveVotes();
      showBirds();
      flyBirds(bird.emoji, x, y);
    });

    // When "Reset votes" is clicked, set everything back to zero
    document.getElementById("reset").addEventListener("click", function () {
      votes = {};
      saveVotes();
      showBirds();
    });

    // Show the cards when the page first loads
    showBirds();
  </script>
</body>
</html>
